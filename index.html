<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b2f57">

<title>CoreCivic Food Service Audit</title>

<style>

:root {
  --navy:#0b2f57;
  --green:#198754;
  --red:#c62828;
  --orange:#e67e22;
  --purple:#6f42c1;
  --border:#d7e0e8;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:#eef3f7;
  color:#1f2933;
}

.app {
  max-width:600px;
  min-height:100vh;
  margin:auto;
  background:white;
}

header {
  position:sticky;
  top:0;
  z-index:20;
  background:var(--navy);
  color:white;
  text-align:center;
  padding:15px;
  font-size:18px;
  font-weight:700;
}

main {
  padding:16px;
}

.hidden {
  display:none;
}

h1 {
  color:var(--navy);
  margin:0 0 8px;
  font-size:25px;
}

.muted {
  color:#68737e;
  font-size:13px;
}

.card {
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  background:white;
  margin-bottom:14px;
}

label {
  display:block;
  margin:13px 0 6px;
  font-weight:700;
}

select,
input[type="date"],
textarea {
  width:100%;
  border:1px solid #bec9d3;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  background:white;
}

textarea {
  resize:vertical;
}

button {
  font-family:inherit;
}

.primary {
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  background:var(--navy);
  color:white;
  font-weight:700;
  font-size:17px;
}

.secondary {
  border:1px solid #b9c3cd;
  border-radius:9px;
  background:white;
  padding:11px;
  font-weight:700;
}

.homeButton {
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  border:1px solid var(--border);
  border-radius:14px;
  background:white;
  padding:15px;
  margin:10px 0;
  text-align:left;
}

.homeIcon {
  width:44px;
  height:44px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:var(--navy);
  color:white;
  font-size:23px;
}

.homeButton b {
  font-size:17px;
}

.homeButton small {
  display:block;
  color:#69747f;
  margin-top:3px;
}

.progressRow {
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin:8px 0 5px;
}

.progressTrack {
  height:8px;
  background:#e5ebef;
  border-radius:99px;
  overflow:hidden;
  margin-bottom:16px;
}

.progressBar {
  height:100%;
  background:#2da562;
  width:0%;
}

.auditItem {
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
  margin-bottom:14px;
}

.itemHeader {
  background:#f6f8fa;
  padding:13px;
  font-weight:700;
}

.itemCode {
  display:block;
  font-size:12px;
  color:#68737e;
  margin-bottom:4px;
}

.requirement {
  padding:13px;
  border-top:1px solid #e7ecef;
}

.requirementText {
  line-height:1.35;
  margin-bottom:10px;
}

.statusGrid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.status {
  min-height:48px;
  border:1px solid #c6d0d8;
  border-radius:9px;
  background:white;
  font-size:13px;
}

.status.compliant.active {
  background:#e8f7ee;
  border-color:var(--green);
  color:#146c43;
}

.status.noncompliant.active {
  background:#fdecec;
  border-color:var(--red);
  color:#a01515;
}

.status.na.active {
  background:#eef1f4;
  border-color:#7c8791;
}

.status.nr.active {
  background:#fff2e2;
  border-color:var(--orange);
  color:#914800;
}

.finding {
  margin-top:12px;
  background:#fff5f5;
  border:1px solid #efb6b6;
  border-radius:11px;
  padding:11px;
}

.required {
  color:var(--red);
}

.dictateButton {
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  background:var(--green);
  color:white;
  font-size:16px;
  font-weight:700;
  margin-bottom:8px;
}

.voiceHelp {
  margin:5px 0 12px;
  background:#eaf4fb;
  color:#214f78;
  border-radius:8px;
  padding:9px;
  font-size:12px;
}

.photoButtons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:7px;
}

.photoButton {
  display:block;
  text-align:center;
  padding:13px 7px;
  border-radius:10px;
  color:white;
  font-weight:700;
  font-size:14px;
}

.cameraButton {
  background:var(--navy);
}

.libraryButton {
  background:var(--purple);
}

.fileInput {
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  overflow:hidden;
}

.photos {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.photoWrap {
  position:relative;
}

.photos img {
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ccd5dd;
}

.removePhoto {
  position:absolute;
  top:-6px;
  right:-6px;
  width:25px;
  height:25px;
  border-radius:50%;
  border:0;
  color:white;
  background:var(--red);
  font-weight:700;
}

.correctedGrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.correctedButton {
  border:1px solid #c5ced6;
  border-radius:9px;
  background:white;
  padding:11px;
  font-weight:700;
}

.correctedButton.yes.active {
  background:#e8f7ee;
  border-color:var(--green);
  color:#146c43;
}

.correctedButton.no.active {
  background:#fdecec;
  border-color:var(--red);
  color:#a01515;
}

.footer {
  position:sticky;
  bottom:0;
  background:white;
  border-top:1px solid var(--border);
  padding:10px;
  display:flex;
  gap:8px;
}

.footer button {
  flex:1;
}

.summaryGrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat {
  border:1px solid var(--border);
  border-radius:12px;
  text-align:center;
  padding:12px;
}

.stat strong {
  display:block;
  color:var(--navy);
  font-size:25px;
}

.notice {
  background:#eaf3fb;
  color:#214f78;
  padding:11px;
  border-radius:10px;
  font-size:13px;
}

</style>
</head>


<body>

<div class="app">

<header>
CoreCivic Food Service Audit
</header>


<!-- HOME -->

<main id="homeView">

  <div style="text-align:center;padding:22px 4px">

    <div style="font-size:46px;color:#0b2f57">
      ✓
    </div>

    <h1>
      CRT-05 Food Service
    </h1>

    <div class="muted">
      iPhone Field Prototype
    </div>

  </div>


  <button
    class="homeButton"
    onclick="showNewAudit()"
  >

    <div class="homeIcon">
      +
    </div>

    <div>

      <b>
        New Audit
      </b>

      <small>
        Start a food service audit
      </small>

    </div>

  </button>


  <button
    id="resumeButton"
    class="homeButton hidden"
    onclick="showAudit()"
  >

    <div
      class="homeIcon"
      style="background:#e67e22"
    >
      ↻
    </div>

    <div>

      <b>
        Resume Audit
      </b>

      <small id="resumeText"></small>

    </div>

  </button>


  <button
    class="homeButton"
    onclick="showCompleted()"
  >

    <div
      class="homeIcon"
      style="background:#198754"
    >
      ✓
    </div>

    <div>

      <b>
        Completed Audits
      </b>

      <small>
        View saved test audits
      </small>

    </div>

  </button>


  <div class="notice">

    This prototype saves the unfinished audit
    on this iPhone while we test the field workflow.

  </div>

</main>



<!-- NEW AUDIT -->

<main
  id="newView"
  class="hidden"
>

<h1>
New Audit
</h1>


<div class="card">

<label>
Facility
</label>

<select id="facility">

<option value="">
Select Facility
</option>

<option>
Sample Facility A
</option>

<option>
Sample Facility B
</option>

<option>
Sample Facility C
</option>

</select>


<label>
Auditor
</label>

<select id="auditor">

<option value="">
Select Auditor
</option>

<option>
Steven Luttrell
</option>

<option>
Auditor 2
</option>

<option>
Auditor 3
</option>

</select>


<label>
Audit Date
</label>

<input
type="date"
id="auditDate"
>

</div>


<button
class="primary"
onclick="startAudit()"
>
Start Audit
</button>


<button
class="secondary"
style="width:100%;margin-top:8px"
onclick="showHome()"
>
Cancel
</button>

</main>



<!-- AUDIT -->

<section
id="auditView"
class="hidden"
>

<main style="padding-bottom:0">

<b>
Audit in Progress
</b>

<div
id="auditFacility"
class="muted"
></div>


<div class="progressRow">

<span id="progressCount"></span>

<span id="progressPercent"></span>

</div>


<div class="progressTrack">

<div
id="progressBar"
class="progressBar"
></div>

</div>

</main>


<div
id="checklist"
style="padding:0 16px 16px"
></div>


<div class="footer">

<button
class="secondary"
onclick="showHome()"
>
Home
</button>


<button
class="primary"
onclick="finalReview()"
>
Final Review
</button>

</div>

</section>



<!-- FINAL REVIEW -->

<main
id="summaryView"
class="hidden"
>

<h1>
Final Review
</h1>


<div class="card">

<b id="summaryFacility"></b>

<div
id="summaryDate"
class="muted"
></div>


<div
style="
font-size:38px;
font-weight:800;
color:#198754;
margin-top:10px;
"
>

<span id="score"></span>%

</div>

</div>


<div class="summaryGrid">

<div class="stat">

<strong id="compliantCount">
0
</strong>

Compliant

</div>


<div class="stat">

<strong id="ncCount">
0
</strong>

Non-Compliant

</div>


<div class="stat">

<strong id="naCount">
0
</strong>

N/A

</div>


<div class="stat">

<strong id="nrCount">
0
</strong>

Not Reviewed

</div>

</div>


<button
class="primary"
style="margin-top:14px"
onclick="completeAudit()"
>
Complete Audit
</button>


<button
class="secondary"
style="width:100%;margin-top:8px"
onclick="showAudit()"
>
Back to Audit
</button>

</main>



<!-- COMPLETED -->

<main
id="completedView"
class="hidden"
>

<h1>
Completed Audits
</h1>


<div id="completedList"></div>


<button
class="secondary"
style="width:100%"
onclick="showHome()"
>
Home
</button>

</main>

</div>



<script>


/* SAMPLE QUESTIONS */

const questions = [

{

code:"CRT-05-G-02",

title:
"Dry Storage Area following Food Safety Guidelines",

checks:[

"Food is stored at least 6 inches off the floor.",

"Food is stored at least 18 inches below ceiling sprinkler heads.",

"Partially used products are properly sealed.",

"Dry storage flooring is clean."

]

},


{

code:"CRT-05-H-02",

title:
"Cooler Storage Areas following Food Safety Guidelines",

checks:[

"Raw or hazardous foods are not stored above ready-to-eat foods.",

"Food is stored at least 6 inches off the floor.",

"Leftovers are labeled, dated, covered and stored in clean containers.",

"Cooler is clean."

]

},


{

code:"CRT-05-L-05",

title:
"Hand Washing is Practiced Effectively",

checks:[

"Hand washing signs are posted.",

"Observed hand washing lasts approximately 20 seconds."

]

}

];



/* ACTIVE AUDIT */

let audit =

JSON.parse(

localStorage.getItem(
"foodAuditActive"
)

)

|| null;



function save() {

localStorage.setItem(

"foodAuditActive",

JSON.stringify(
audit
)

);

}



/* SCREEN CONTROL */

function hideAll() {

[

"homeView",

"newView",

"auditView",

"summaryView",

"completedView"

]

.forEach(

id =>

document
.getElementById(id)
.classList
.add("hidden")

);

}



function showHome() {

hideAll();


document
.getElementById(
"homeView"
)
.classList
.remove("hidden");


const resume =

document
.getElementById(
"resumeButton"
);


if(audit) {

resume
.classList
.remove("hidden");


document
.getElementById(
"resumeText"
)
.innerText =

audit.facility;

}

else {

resume
.classList
.add("hidden");

}

}



function showNewAudit() {

hideAll();


document
.getElementById(
"newView"
)
.classList
.remove("hidden");

}



/* START */

function startAudit() {

const facility =

document
.getElementById(
"facility"
)
.value;


const auditor =

document
.getElementById(
"auditor"
)
.value;


const date =

document
.getElementById(
"auditDate"
)
.value;


if(
!facility
||
!auditor
||
!date
) {

alert(

"Please select Facility, Auditor and Audit Date."

);

return;

}


audit = {

facility,

auditor,

date,

answers:{},

comments:{},

corrective:{},

corrected:{},

photos:{}

};


save();

showAudit();

}



/* SHOW AUDIT */

function showAudit() {

if(!audit) {

showHome();

return;

}


hideAll();


document
.getElementById(
"auditView"
)
.classList
.remove("hidden");


document
.getElementById(
"auditFacility"
)
.innerText =

audit.facility;


renderQuestions();

}



/* STATUS */

function setStatus(
key,
status
) {

audit.answers[key] =
status;


if(
status !==
"noncompliant"
) {

delete audit.comments[key];

delete audit.corrective[key];

delete audit.corrected[key];

delete audit.photos[key];

}


save();

renderQuestions(key);

}



/* TEXT */

function setComment(
key,
value
) {

audit.comments[key] =
value;

save();

}



function setCorrective(
key,
value
) {

audit.corrective[key] =
value;

save();

}



function setCorrected(
key,
value
) {

audit.corrected[key] =
value;

save();

renderQuestions(key);

}



/* IPHONE DICTATION */

function dictate(
key,
field
) {

let id;


if(
field ===
"comment"
) {

id =
"comment-" +
key;

}

else {

id =
"corrective-" +
key;

}


const box =

document
.getElementById(id);


box.focus();


box.scrollIntoView({

behavior:"smooth",

block:"center"

});


setTimeout(

function() {

alert(

"The iPhone keyboard is now open.\n\nTap the microphone button on the iPhone keyboard and begin speaking."

);

},

250

);

}



/* PHOTOS */

function addPhotos(
key,
input
) {

const files =

Array.from(
input.files || []
);


if(
files.length === 0
) {

return;

}


audit.photos[key] =

audit.photos[key]

|| [];


files.forEach(

file => {


const reader =

new FileReader();


reader.onload =

function() {


audit
.photos[key]
.push(
reader.result
);


save();

renderQuestions(key);

};


reader.readAsDataURL(
file
);


}

);

}



function removePhoto(
key,
index
) {

audit
.photos[key]
.splice(
index,
1
);


save();

renderQuestions(key);

}



/* STATUS BUTTON */

function statusButton(
key,
value,
label,
current
) {

return `

<button

class="
status
${value}
${
current === value
? "active"
: ""
}
"

onclick="
setStatus(
'${key}',
'${value}'
)
"

>

${label}

</button>

`;

}



/* RENDER */

function renderQuestions(
anchor
) {

let html = "";

let total = 0;


questions
.forEach(

question => {


html += `

<div
class="auditItem"
>

<div
class="itemHeader"
>

<span
class="itemCode"
>

${question.code}

</span>

${question.title}

</div>

`;


question
.checks
.forEach(

(text,index) => {


total++;


const key =

question.code

+

"-"

+

index;


const current =

audit.answers[key]

|| "";


html += `

<div
class="requirement"
id="${key}"
>

<div
class="requirementText"
>

${text}

</div>


<div
class="statusGrid"
>

${

statusButton(

key,

"compliant",

"✓ Compliant",

current

)

}


${

statusButton(

key,

"noncompliant",

"✕ Non-Compliant",

current

)

}


${

statusButton(

key,

"na",

"N/A",

current

)

}


${

statusButton(

key,

"nr",

"Not Reviewed",

current

)

}

</div>

`;


if(
current ===
"noncompliant"
) {


const photos =

audit.photos[key]

|| [];


const corrected =

audit.corrected[key]

|| "";


html += `

<div
class="finding"
>


<label>

Finding Comment

<span
class="required"
>
Required
</span>

</label>


<button

type="button"

class="dictateButton"

onclick="
dictate(
'${key}',
'comment'
)
"

>

🎤 Dictate Comment

</button>


<textarea

id="
comment-${key}
"

rows="3"

placeholder="
Type comment here...
"

oninput="
setComment(
'${key}',
this.value
)
"

>${audit.comments[key] || ""}</textarea>


<div
class="voiceHelp"
>

Tap
<b>Dictate Comment</b>.

When the iPhone keyboard appears,
tap the microphone on the keyboard
and begin speaking.

</div>



<label>

Photos

</label>


<div
class="photoButtons"
>


<label
for="
camera-${key}
"
class="
photoButton
cameraButton
"
>

📷 Take Photo

</label>


<input

id="
camera-${key}
"

class="fileInput"

type="file"

accept="image/*"

capture="environment"

onchange="
addPhotos(
'${key}',
this
)
"

>



<label
for="
library-${key}
"
class="
photoButton
libraryButton
"
>

🖼 Choose Photo

</label>


<input

id="
library-${key}
"

class="fileInput"

type="file"

accept="image/*"

multiple

onchange="
addPhotos(
'${key}',
this
)
"

>


</div>



<div
class="photos"
>


${

photos

.map(

(photo,index) =>

`

<div
class="photoWrap"
>

<img
src="${photo}"
>

<button

class="removePhoto"

onclick="
removePhoto(
'${key}',
${index}
)
"

>

×

</button>

</div>

`

)

.join("")

}


</div>



<label>

Corrective Action

<span
class="muted"
>

Optional

</span>

</label>


<button

type="button"

class="dictateButton"

onclick="
dictate(
'${key}',
'corrective'
)
"

>

🎤 Dictate Corrective Action

</button>


<textarea

id="
corrective-${key}
"

rows="2"

placeholder="
Optional corrective action...
"

oninput="
setCorrective(
'${key}',
this.value
)
"

>${audit.corrective[key] || ""}</textarea>



<label>

Corrected On Site?

</label>


<div
class="correctedGrid"
>


<button

class="
correctedButton
yes
${
corrected ===
"yes"
?
"active"
:
""
}
"

onclick="
setCorrected(
'${key}',
'yes'
)
"

>

✓ Yes

</button>



<button

class="
correctedButton
no
${
corrected ===
"no"
?
"active"
:
""
}
"

onclick="
setCorrected(
'${key}',
'no'
)
"

>

✕ No

</button>


</div>


</div>

`;

}


html +=

"</div>";

}

);


html +=

"</div>";

}

);



document
.getElementById(
"checklist"
)
.innerHTML =

html;



const answered =

Object.keys(
audit.answers
)
.length;



const percent =

Math.round(

answered

/

total

*

100

);



document
.getElementById(
"progressCount"
)
.innerText =

answered

+

" of "

+

total

+

" reviewed";



document
.getElementById(
"progressPercent"
)
.innerText =

percent

+

"%";



document
.getElementById(
"progressBar"
)
.style
.width =

percent

+

"%";



if(anchor) {

setTimeout(

function() {

document
.getElementById(
anchor
)
?.scrollIntoView({

block:"center"

});

},

50

);

}

}



/* FINAL REVIEW */

function finalReview() {

const total =

questions
.reduce(

(sum,q) =>

sum

+

q.checks.length,

0

);


const answered =

Object.keys(
audit.answers
)
.length;


if(
answered <
total
) {

alert(

(total - answered)

+

" requirement(s) still need an answer."

);

return;

}


for(
const key
in audit.answers
) {


if(

audit.answers[key]
===
"noncompliant"

&&

!audit
.comments[key]
?.trim()

) {

alert(

"Every Non-Compliant finding requires a comment."

);

return;

}

}


hideAll();


document
.getElementById(
"summaryView"
)
.classList
.remove("hidden");


document
.getElementById(
"summaryFacility"
)
.innerText =

audit.facility;


document
.getElementById(
"summaryDate"
)
.innerText =

audit.date;


const values =

Object.values(
audit.answers
);


const compliant =

values.filter(
v =>
v ===
"compliant"
).length;


const nc =

values.filter(
v =>
v ===
"noncompliant"
).length;


const na =

values.filter(
v =>
v ===
"na"
).length;


const nr =

values.filter(
v =>
v ===
"nr"
).length;


const applicable =

compliant + nc;


const score =

applicable

?

Math.round(

compliant

/

applicable

*

100

)

:

0;


document
.getElementById(
"score"
)
.innerText =

score;


document
.getElementById(
"compliantCount"
)
.innerText =

compliant;


document
.getElementById(
"ncCount"
)
.innerText =

nc;


document
.getElementById(
"naCount"
)
.innerText =

na;


document
.getElementById(
"nrCount"
)
.innerText =

nr;

}



/* COMPLETE */

function completeAudit() {

const completed =

JSON.parse(

localStorage.getItem(
"foodAuditCompleted"
)

)

|| [];


completed.unshift({

...audit,

completed:
new Date()
.toISOString()

});


localStorage.setItem(

"foodAuditCompleted",

JSON.stringify(
completed
)

);


localStorage.removeItem(
"foodAuditActive"
);


audit = null;


alert(
"Audit completed."
);


showCompleted();

}



/* COMPLETED */

function showCompleted() {

hideAll();


document
.getElementById(
"completedView"
)
.classList
.remove("hidden");


const completed =

JSON.parse(

localStorage.getItem(
"foodAuditCompleted"
)

)

|| [];


let html = "";


completed
.forEach(

a => {


html += `

<div
class="card"
>

<b>

${a.facility}

</b>

<div
class="muted"
style="margin-top:4px"
>

${a.date}

•

${a.auditor}

</div>

</div>

`;

}

);


if(!html) {

html = `

<div
class="notice"
>

No completed audits yet.

</div>

`;

}


document
.getElementById(
"completedList"
)
.innerHTML =

html;

}



/* START APP */

showHome();

</script>

</body>
</html>
